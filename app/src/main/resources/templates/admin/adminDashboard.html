<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" />
  <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
  <link rel="stylesheet" th:href="@{/assets/css/style.css}">
  <script th:src="@{/js/util.js}" defer></script>
  <script type="module" th:src="@{/js/render.js}"></script>
  <script type="module" th:src="@{/js/components/header.js}"></script>
  <script type="module" th:src="@{/js/components/footer.js}"></script>
</head>
<body>
  <div class="container">
    <div class="wrapper">
      <div id="header"></div>
      <main class="main-content">
        <h1>Admin Portal — Manage Doctors</h1>
        <div class="filters">
          <input type="text" id="searchBar" placeholder="Search doctor by name" class="input-field">
          <select id="timeFilter" class="input-field select-dropdown">
            <option value="">Time (All)</option>
            <option value="AM">AM</option>
            <option value="PM">PM</option>
          </select>
          <select id="specialtyFilter" class="input-field select-dropdown">
            <option value="">Specialty (All)</option>
            <option value="cardiologist">Cardiologist</option>
            <option value="dermatologist">Dermatologist</option>
            <option value="neurologist">Neurologist</option>
            <option value="pediatrician">Pediatrician</option>
            <option value="dentist">Dentist</option>
            <option value="general">General Physician</option>
          </select>
        </div>
        <div id="content" class="doctor-list"></div>
      </main>
      <div id="footer"></div>
    </div>
  </div>

  <div id="modal" class="modal" style="display:none;">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" th:src="@{/js/adminDashboard.js}"></script>
  <script type="module">
    import { openModal } from "/js/components/modals.js";
    window.openModal = openModal;
    import { renderHeader } from "/js/components/header.js";
    import { renderFooter } from "/js/components/footer.js";
    localStorage.setItem("userRole", "admin");
    renderHeader();
    renderFooter();
  </script>
</body>
</html>
