<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor Dashboard</title>
  <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" />
  <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
  <link rel="stylesheet" th:href="@{/assets/css/style.css}">
  <script th:src="@{/js/util.js}" defer></script>
</head>
<body>
  <div class="container">
    <div class="wrapper">
      <div id="header"></div>
      <main class="main-content">
        <h1>Doctor Portal — Patient Appointments</h1>
        <div class="filters">
          <input type="text" id="searchBar" placeholder="Search patient by name" class="input-field">
          <input type="date" id="datePicker" class="input-field">
          <button id="todayButton" class="dashboard-btn">Today</button>
        </div>
        <table class="appointment-table">
          <thead>
            <tr>
              <th>Patient ID</th>
              <th>Name</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Prescription</th>
            </tr>
          </thead>
          <tbody id="patientTableBody"></tbody>
        </table>
      </main>
      <div id="footer"></div>
    </div>
  </div>

  <script type="module" th:src="@{/js/doctorDashboard.js}"></script>
  <script type="module">
    import { renderHeader } from "/js/components/header.js";
    import { renderFooter } from "/js/components/footer.js";
    localStorage.setItem("userRole", "doctor");
    renderHeader();
    renderFooter();
  </script>
</body>
</html>
