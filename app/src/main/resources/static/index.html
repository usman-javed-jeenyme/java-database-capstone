<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Role — Smart Clinic</title>
  <link rel="icon" type="image/png" href="./assets/images/logo/logo.png">
  <link rel="stylesheet" href="./assets/css/index.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <script src="./js/util.js" defer></script>
  <script type="module" src="./js/render.js"></script>
  <script type="module" src="./js/components/header.js"></script>
  <script type="module" src="./js/components/footer.js"></script>
</head>
<body onload="renderHeader(); renderFooter();">
  <div class="container">
    <div class="wrapper">
      <div id="header"></div>
      <main class="main-content role-select">
        <h1>Select Your Role</h1>
        <p>Choose how you want to access the Smart Clinic Management System.</p>
        <div class="role-buttons">
          <button id="adminLogin" class="role-btn">Admin</button>
          <button id="patientLogin" class="role-btn" onclick="window.location.href='/pages/patientDashboard.html'">Patient</button>
          <button id="doctorLogin" class="role-btn">Doctor</button>
        </div>
      </main>
      <div id="footer"></div>
    </div>
  </div>

  <div id="modal" class="modal" style="display:none;">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="./js/services/index.js" defer></script>
  <script type="module">
    import { openModal } from "./js/components/modals.js";
    window.openModal = openModal;
  </script>
</body>
</html>
